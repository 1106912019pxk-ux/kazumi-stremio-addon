name: Build Kazumi Stremio Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - "stremio-addon/**"
      - ".github/workflows/stremio-addon.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "stremio-addon/**"
      - ".github/workflows/stremio-addon.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify and package
        shell: pwsh
        working-directory: stremio-addon
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          .\scripts\build.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-stremio-addon
          path: stremio-addon/release/*
          if-no-files-found: error

  verify-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stremio-addon/Dockerfile
          push: false
          tags: kazumi-stremio-addon:ci
