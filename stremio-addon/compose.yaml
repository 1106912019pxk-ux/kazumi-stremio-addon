services:
  kazumi-stremio-addon:
    build:
      context: ..
      dockerfile: stremio-addon/Dockerfile
    ports:
      - "7000:7000"
    environment:
      PORT: "7000"
      KAZUMI_RULES_DIR: "/rules"
      KAZUMI_BANGUMI_MODE: "${KAZUMI_BANGUMI_MODE:-false}"
      KAZUMI_RULES_REMOTE: "${KAZUMI_RULES_REMOTE:-}"
      KAZUMI_RULES_ALLOWLIST: "${KAZUMI_RULES_ALLOWLIST:-}"
      KAZUMI_CACHE_TTL_MS: "${KAZUMI_CACHE_TTL_MS:-60000}"
      KAZUMI_RULE_FAILURE_THRESHOLD: "${KAZUMI_RULE_FAILURE_THRESHOLD:-2}"
      KAZUMI_RULE_COOLDOWN_MS: "${KAZUMI_RULE_COOLDOWN_MS:-120000}"
    volumes:
      - ./rules:/rules:ro
    restart: unless-stopped
